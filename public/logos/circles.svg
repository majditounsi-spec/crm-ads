<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Three overlapping circles -->
  <circle cx="190" cy="240" r="100" fill="white" opacity="0.2"/>
  <circle cx="322" cy="240" r="100" fill="white" opacity="0.2"/>
  <circle cx="256" cy="300" r="100" fill="white" opacity="0.2"/>
  <!-- M monogram in center -->
  <text x="256" y="290" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="160" fill="white" letter-spacing="-8">M</text>
</svg>
