<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wave2" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="256" r="200" fill="white" opacity="0.04"/>

  <!-- M letter - modern geometric style -->
  <!-- Left vertical -->
  <rect x="100" y="140" width="48" height="232" rx="24" fill="white"/>

  <!-- Right vertical -->
  <rect x="364" y="140" width="48" height="232" rx="24" fill="white"/>

  <!-- Left diagonal -->
  <path d="M124 170 L256 290 L256 230 L148 140 Z" fill="white" opacity="0.95"/>

  <!-- Right diagonal -->
  <path d="M388 170 L256 290 L256 230 L364 140 Z" fill="white" opacity="0.95"/>

  <!-- Center peak accent -->
  <circle cx="256" cy="270" r="18" fill="url(#accent)"/>

  <!-- Flow wave bottom -->
  <path d="M120 350 Q188 320 256 340 Q324 360 392 330" stroke="url(#wave2)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Trend arrow -->
  <path d="M340 160 L380 130 L370 160" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
